name: Online services checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'api-service/**'
      - 'contracts/**'
      - 'ci-proposals/**'
      - 'app/src/androidTest/assets/cross-platform/**'
      - 'ios/PitTechTests/Fixtures/**'
      - '.github/workflows/online-services.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pittech_test_relay
          POSTGRES_USER: pittech_ci
          POSTGRES_PASSWORD: pittech_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pittech_ci -d pittech_test_relay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pittech_ci:pittech_ci_only@127.0.0.1:5432/pittech_test_relay
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: api-service/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: api-service
      - name: Typecheck and audit runtime dependencies
        run: |
          npm run typecheck
          npm audit --omit=dev --audit-level=high
        working-directory: api-service
      - name: Verify canonical fixtures and all relay contracts
        run: |
          npm run fixtures:check
          npm test
        working-directory: api-service
      - name: Build the production image
        run: docker build -f api-service/Dockerfile -t pittech-api:ci .
      - name: Verify the production image validates the six actual native packs
        run: |
          docker run --rm -i --entrypoint node \
            -v "$PWD/app/src/androidTest/assets/cross-platform:/fixtures/native:ro" \
            -v "$PWD/ios/PitTechTests/Fixtures:/fixtures/android:ro" \
            pittech-api:ci --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { canonicalPack } from './src/pack.ts';
          for (const platform of ['native','android']) for (const kind of ['recipe','collection','cook']) {
            const result = await canonicalPack(await readFile(`/fixtures/${platform}/${platform}-cook-pack-${kind}-v1.pittech`));
            if (result.summary.kind !== kind) throw new Error('Fixture kind mismatch');
          }
          import { canonicalPublication } from './src/publication-pack.ts';
          import { writeZip } from './src/zip.ts';
          const publication = await readFile('/srv/contracts/fixtures/anonymous-pork.json');
          const accepted = await canonicalPublication(writeZip(new Map([['publication.json', publication]])));
          if (accepted.payload.identityMode !== 'anonymous') throw new Error('Publication fixture changed');
          console.log('Production image pack and publication validation passed');
          JS
      - name: Require unconfigured production startup to fail closed
        run: |
          set +e
          docker run --rm pittech-api:ci > startup-check.txt 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -Fx 'service_start_failed' startup-check.txt
          ! grep -q 'ERR_MODULE_NOT_FOUND' startup-check.txt
