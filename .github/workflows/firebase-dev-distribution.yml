name: Firebase Dev distribution

on:
  workflow_dispatch:
    inputs:
      confirm_distribution:
        description: Explicitly authorize distributing the tested main build to Firebase testers.
        required: true
        type: boolean
        default: false
      online_environment:
        description: Choose offline, accepted isolated staging, or accepted production online services.
        required: true
        type: choice
        options: [offline, staging, production]
        default: offline

concurrency:
  group: pittech-firebase-dev
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    name: Build and distribute PitTech Dev
    # A merge authorizes code integration, not app distribution.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_distribution && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require successful Android checks for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=30")
          tested_run=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_sha == env.GITHUB_SHA)] | first' <<< "$runs")
          test_number=$(jq -er '.run_number' <<< "$tested_run")
          test_attempt=$(jq -er '.run_attempt' <<< "$tested_run")
          echo "PITTECH_TESTED_RUN_NUMBER=$test_number" >> "$GITHUB_ENV"
          echo "PITTECH_TESTED_RUN_ATTEMPT=$test_attempt" >> "$GITHUB_ENV"

      - name: Verify signing and Google service-account secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -e \
            '.type == "service_account" and (.private_key | type == "string")' >/dev/null

      - name: Select only an accepted online deployment
        env:
          SELECTED_ONLINE_ENVIRONMENT: ${{ inputs.online_environment }}
          STAGING_ONLINE_READY: ${{ vars.PITTECH_STAGING_ONLINE_READY }}
          PRODUCTION_ONLINE_READY: ${{ vars.PITTECH_PRODUCTION_ONLINE_READY }}
          MONTHLY_PRODUCT_ID: ${{ vars.PITTECH_PRO_MONTHLY_PRODUCT_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          online_enabled=false
          online_environment=production
          product_id=""
          case "$SELECTED_ONLINE_ENVIRONMENT" in
            offline) ;;
            staging|production)
              if [[ "$SELECTED_ONLINE_ENVIRONMENT" == "staging" ]]; then ready="$STAGING_ONLINE_READY"; else ready="$PRODUCTION_ONLINE_READY"; fi
              if [[ "$ready" != "true" || -z "$MONTHLY_PRODUCT_ID" ]]; then
                echo "::error::Complete deployed account/sync/community/deletion and store acceptance before distributing an online build."
                exit 1
              fi
              profile_runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/online-profile-checks.yml/runs?head_sha=$GITHUB_SHA&per_page=30")
              jq -e '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_sha == env.GITHUB_SHA)] | length > 0' <<< "$profile_runs" > /dev/null
              online_enabled=true
              online_environment="$SELECTED_ONLINE_ENVIRONMENT"
              product_id="$MONTHLY_PRODUCT_ID"
              ;;
            *) echo "::error::Unsupported online deployment."; exit 1 ;;
          esac
          if [[ ! "$product_id" =~ ^[A-Za-z0-9._-]{0,200}$ ]]; then
            echo "::error::Invalid monthly product identifier."
            exit 1
          fi
          echo "PITTECH_DISTRIBUTION_ONLINE_ENVIRONMENT=$online_environment" >> "$GITHUB_ENV"
          echo "PITTECH_DISTRIBUTION_ONLINE_ENABLED=$online_enabled" >> "$GITHUB_ENV"
          echo "PITTECH_DISTRIBUTION_PRODUCT_ID=$product_id" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Derive unique Dev version
        id: version
        env:
          SOURCE_RUN_NUMBER: ${{ env.PITTECH_TESTED_RUN_NUMBER }}
          SOURCE_RUN_ATTEMPT: ${{ env.PITTECH_TESTED_RUN_ATTEMPT }}
        run: |
          set -euo pipefail
          version_code=$(( SOURCE_RUN_NUMBER * 1000 + SOURCE_RUN_ATTEMPT ))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Generated versionCode ${version_code} is outside Android's supported range."
            exit 1
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${SOURCE_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"

      - name: Build the Dev APK with test ads
        shell: bash
        env:
          DEV_VERSION_CODE: ${{ steps.version.outputs.code }}
          DEV_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gradle --no-daemon assembleDev \
            -PpittechLiveAds=false \
            "-PpittechVersionCode=$DEV_VERSION_CODE" \
            "-PpittechVersionName=$DEV_VERSION_NAME" \
            "-PpittechOnlineEnvironment=$PITTECH_DISTRIBUTION_ONLINE_ENVIRONMENT" \
            "-PpittechOnlineEnabled=$PITTECH_DISTRIBUTION_ONLINE_ENABLED" \
            "-PpittechProProductId=$PITTECH_DISTRIBUTION_PRODUCT_ID"

      - name: Sign the Dev APK with the existing Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_store_path="${RUNNER_TEMP}/pittech-upload-key.jks"
          unsigned_apk="app/build/outputs/apk/dev/app-dev-unsigned.apk"
          signed_apk="${RUNNER_TEMP}/pittech-dev.apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          trap 'rm -f "$key_store_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          chmod 600 "$key_store_path"
          "$apksigner" sign \
            --ks "$key_store_path" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify --verbose "$signed_apk"

      - id: google-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: |
          npm install --global firebase-tools
          firebase --version

      - name: Create change notes for Firebase testers
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          REPO_NAME: ${{ github.repository }}
        run: >-
          python3 scripts/release_notes.py dev
          --commit "$SOURCE_SHA"
          --version "$VERSION_NAME"
          --repo "$REPO_NAME"
          --output "$RUNNER_TEMP/pittech-dev-notes.txt"

      - name: Include the tested online environment and purchase-testing limit in release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "pittech-dev-notes.txt"
          enabled = os.environ["PITTECH_DISTRIBUTION_ONLINE_ENABLED"] == "true"
          profile = os.environ["PITTECH_DISTRIBUTION_ONLINE_ENVIRONMENT"] if enabled else "offline"
          extra = "\nOnline services: " + profile + ".\n"
          if enabled:
              extra += "Accounts, private sync and community use this environment. The side-by-side com.pittech.dev install does not support the com.pittech Play subscription purchase sheet; use the matching Play test-track build for real purchases.\n"
          path.write_text(path.read_text() + extra)
          PY

      - name: Distribute to the internal Firebase group
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
          PITTECH_DEV_APK: ${{ runner.temp }}/pittech-dev.apk
          SOURCE_RUN_NUMBER: ${{ env.PITTECH_TESTED_RUN_NUMBER }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          firebase appdistribution:distribute "$PITTECH_DEV_APK" \
            --app "1:848714330882:android:328e155174c939db6b481b" \
            --groups "pittech-dev" \
            --release-notes-file "$RUNNER_TEMP/pittech-dev-notes.txt"
