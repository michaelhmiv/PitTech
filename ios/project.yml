name: PitTech
options:
  bundleIdPrefix: com.pittech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PitTech/Info.plist
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  PitTech:
    type: application
    platform: iOS
    sources:
      - path: PitTech
        excludes:
          - "**/*.xcassets/**"
    resources:
      - path: PitTech/Assets.xcassets
      - path: PitTech/PrivacyInfo.xcprivacy
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech
        PRODUCT_NAME: PitTech
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PITTECH_ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        PITTECH_NATIVE_AD_UNIT_ID: "ca-app-pub-3940256099942544/3986624511"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [PitTechTests]
      gatherCoverageData: false
  PitTechTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PitTechTests]
    dependencies:
      - target: PitTech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech.tests
