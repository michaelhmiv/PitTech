name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build for Simulator or create a signed App Store IPA.
        required: true
        type: choice
        options:
          - simulator
          - app-store-ipa
        default: simulator

permissions:
  contents: read

concurrency:
  group: pittech-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator-build:
    name: Build iOS app for Simulator
    if: github.event_name == 'push' || inputs.build_mode == 'simulator'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Confirm Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/PitTech.xcodeproj -scheme PitTech

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/PitTech.xcodeproj
          -scheme PitTech
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios-simulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload Simulator app
        uses: actions/upload-artifact@v6
        with:
          name: pittech-ios-simulator-${{ github.run_number }}
          path: build/ios-simulator/Build/Products/Debug-iphonesimulator/PitTech.app
          if-no-files-found: error
          retention-days: 14

  app-store-ipa:
    name: Create a signed App Store IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'app-store-ipa'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Require signing material and iOS AdMob IDs
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_ADMOB_APP_ID: ${{ vars.IOS_ADMOB_APP_ID }}
          IOS_ADMOB_NATIVE_AD_UNIT_ID: ${{ vars.IOS_ADMOB_NATIVE_AD_UNIT_ID }}
        run: |
          set -euo pipefail
          for secret_name in \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_ADMOB_APP_ID \
            IOS_ADMOB_NATIVE_AD_UNIT_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure ${secret_name} in this repository's Actions secrets or variables before requesting an App Store IPA."
              exit 1
            fi
          done

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/pittech-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/PitTech.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/PitTech.mobileprovision" > "$RUNNER_TEMP/PitTech-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/PitTech-profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/PitTech-profile.plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/PitTech-profile.plist")
          if [[ "$app_identifier" != "R42LWFBXBH.com.pittech" ]]; then
            echo "::error::The provisioning profile must match team R42LWFBXBH and bundle ID com.pittech."
            exit 1
          fi
          cp "$RUNNER_TEMP/PitTech.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PITTECH_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "PITTECH_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and resolve the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/PitTech.xcodeproj -scheme PitTech

      - name: Archive for App Store Connect
        env:
          IOS_ADMOB_APP_ID: ${{ vars.IOS_ADMOB_APP_ID }}
          IOS_ADMOB_NATIVE_AD_UNIT_ID: ${{ vars.IOS_ADMOB_NATIVE_AD_UNIT_ID }}
        run: >-
          xcodebuild archive
          -project ios/PitTech.xcodeproj
          -scheme PitTech
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/PitTech.xcarchive
          -derivedDataPath build/ios-release
          DEVELOPMENT_TEAM=R42LWFBXBH
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          PROVISIONING_PROFILE_SPECIFIER="$PITTECH_PROFILE_NAME"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          PITTECH_ADMOB_APP_ID="$IOS_ADMOB_APP_ID"
          PITTECH_NATIVE_AD_UNIT_ID="$IOS_ADMOB_NATIVE_AD_UNIT_ID"
          CODE_SIGNING_KEYCHAIN="$PITTECH_KEYCHAIN_PATH"
          CODE_SIGNING_ALLOWED=YES

      - name: Export an App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>R42LWFBXBH</string>
            <key>provisioningProfiles</key><dict>
              <key>com.pittech</key><string>$PITTECH_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.pittech $PITTECH_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/PitTech.xcarchive -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload signed archive and IPA artifacts
        uses: actions/upload-artifact@v6
        with:
          name: pittech-ios-app-store-${{ github.run_number }}
          path: |
            build/PitTech.xcarchive
            build/export/*.ipa
          if-no-files-found: error
          retention-days: 30
