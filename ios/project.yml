name: PitTech
options:
  bundleIdPrefix: com.pittech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Staging: debug
  StoreSandbox: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PitTech/Info.plist
packages:
  CombustionBLE:
    url: https://github.com/combustion-inc/combustion-ios-ble.git
    exactVersion: 1.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  PitTech:
    type: application
    platform: iOS
    sources:
      - path: PitTech
      # The contract MUST be declared here (not under resources:): xcodegen
      # demonstrably drops it from the app bundle when declared under
      # resources: (it only ever reached PitTechTests.xctest), while the
      # sources+buildPhase form copies it — the unit-test target proves it.
      - path: Contracts/private-sync-projection-v1.json
        buildPhase: resources
      - path: Contracts/insights-calculations-v1.json
        buildPhase: resources
    resources:
      - path: PitTech/PrivacyInfo.xcprivacy
      - path: PitTech/TelemetryNotices.txt
    dependencies:
      - package: CombustionBLE
        product: CombustionBLE
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech
        PRODUCT_NAME: PitTech
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PITTECH_ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        PITTECH_NATIVE_AD_UNIT_ID: "ca-app-pub-3940256099942544/3986624511"
        # Owner-gated: the monthly PitTech Pro product ID. Empty until the
        # store product exists; the paywall treats empty as not-configured.
        PITTECH_PRO_PRODUCT_ID: ""
        PITTECH_ONLINE_ENVIRONMENT: "production"
        PITTECH_ONLINE_ENABLED: "NO"
        PITTECH_STORE_SANDBOX_BUILD: "NO"
        PITTECH_PUBLIC_HOST: "pittech.app"
        PITTECH_LINK_SCHEME: "pittech"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PitTech/PitTech.entitlements
        # Slice 7 (TURN-IN, Area 07): the Pro alternate app icons declared in
        # Info.plist's CFBundleAlternateIcons ship as asset-catalog icon
        # sets; actool only compiles them when they are named here.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - ProEmber
          - ProMidnight
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.pittech.staging
          PITTECH_ONLINE_ENVIRONMENT: "staging"
          PITTECH_ONLINE_ENABLED: "NO"
          PITTECH_PUBLIC_HOST: "staging.pittech.app"
          PITTECH_LINK_SCHEME: "pittech-staging"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        StoreSandbox:
          PITTECH_ONLINE_ENVIRONMENT: "staging"
          PITTECH_ONLINE_ENABLED: "NO"
          PITTECH_STORE_SANDBOX_BUILD: "YES"
          PITTECH_PUBLIC_HOST: "staging.pittech.app"
          PITTECH_LINK_SCHEME: "pittech-staging"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "R42LWFBXBH"
          PROVISIONING_PROFILE_SPECIFIER: "PitTech App Store CI"
        Release:
          # App Store builds sign manually with the CI-generated profile.
          # Scoped to this target only: Swift Package targets (GoogleMobileAds,
          # ZIPFoundation, ...) reject provisioning profiles, so these settings
          # must never be passed as global xcodebuild overrides.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "R42LWFBXBH"
          PROVISIONING_PROFILE_SPECIFIER: "PitTech App Store CI"
    scheme:
      testTargets: [PitTechTests, PitTechUITests]
      gatherCoverageData: false
  PitTechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitTechTests
        excludes: ["Fixtures/**"]
      - path: PitTechTests/Fixtures/android-meal-v9.zip
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-guide-meal-v10.zip
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-cook-pack-recipe-v1.pittech
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-cook-pack-collection-v1.pittech
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-cook-pack-cook-v1.pittech
        buildPhase: resources
      - path: PitTechTests/Fixtures/relay-android-cook-v1.pittech
        buildPhase: resources
      - path: PitTechTests/Fixtures/sync-merge-v1.json
        buildPhase: resources
      - path: PitTechTests/Fixtures/share-card-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/relay-links-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/auth-native-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/online-environments-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/public-links-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/public-native-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/source-review-v1.json
        buildPhase: resources
      - path: Contracts/private-sync-projection-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/private-sync-projection-cases-v1.json
        buildPhase: resources
      - path: Contracts/insights-calculations-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/insights-calculations-cases-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/native-publication-android-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/community-benchmarks-v1.json
        buildPhase: resources
      - path: ../contracts/fixtures/pro-personal-v1.json
        buildPhase: resources
    dependencies:
      - target: PitTech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech.tests

  PitTechUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PitTechUITests]
    dependencies:
      - target: PitTech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech.uitests
        TEST_TARGET_NAME: PitTech
