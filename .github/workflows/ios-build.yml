name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main, feature/cook-experience-recovery, test/telemetry-provider-integration]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build for Simulator or build and upload to App Store Connect.
        required: true
        type: choice
        options:
          - simulator
          - app-store-ipa
        default: simulator

permissions:
  contents: read

concurrency:
  group: pittech-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Build iOS app for Simulator
    if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'simulator'
    runs-on: macos-26
    timeout-minutes: 120
