server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    location = /app-ads.txt {
        default_type text/plain;
        try_files /app-ads.txt =404;
    }

    location / {
        try_files /index.html =404;
    }
}
