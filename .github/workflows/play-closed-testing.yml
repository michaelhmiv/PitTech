name: Play release

on:
  workflow_dispatch:
    inputs:
      release_track:
        description: Upload to Alpha closed testing or start a staged production rollout.
        required: true
        type: choice
        options:
          - alpha
          - production
        default: alpha
      confirm_production_readiness:
        description: Confirm Play production access, required store disclosures, and UMP setup are complete.
        required: true
        type: boolean
        default: false
      rollout_fraction:
        description: Portion of users in the initial production rollout.
        required: true
        type: choice
        options:
          - "0.05"
          - "0.10"
          - "0.25"
          - "0.50"
        default: "0.10"

concurrency:
  group: pittech-play-release
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  publish-play-release:
    name: Build and publish Play release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Require explicit production-readiness confirmation
        env:
          RELEASE_TRACK: ${{ inputs.release_track }}
          CONFIRM_PRODUCTION_READINESS: ${{ inputs.confirm_production_readiness }}
          ROLLOUT_FRACTION: ${{ inputs.rollout_fraction }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TRACK" != "alpha" && "$RELEASE_TRACK" != "production" ]]; then
            echo "::error::Choose the Alpha or production Play track."
            exit 1
          fi
          if [[ "$RELEASE_TRACK" == "production" && "$CONFIRM_PRODUCTION_READINESS" != "true" ]]; then
            echo "::error::Production publishing requires confirmation that Play production access and required Play disclosures are complete."
            exit 1
          fi
          if [[ "$RELEASE_TRACK" == "production" && "$ROLLOUT_FRACTION" != "0.05" && "$ROLLOUT_FRACTION" != "0.10" && "$ROLLOUT_FRACTION" != "0.25" && "$ROLLOUT_FRACTION" != "0.50" ]]; then
            echo "::error::Choose a supported staged-rollout fraction."
            exit 1
          fi

      - name: Require successful Android checks for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Only main may publish Android release artifacts."
            exit 1
          fi
          tested_sha=$(git rev-parse HEAD)
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?head_sha=$tested_sha&event=push&per_page=30")
          if ! jq -e '.workflow_runs | any(.status == "completed" and .conclusion == "success")' <<< "$runs" >/dev/null; then
            echo "::error::Required Android checks have not passed on $tested_sha. Publish only a tested main commit."
            exit 1
          fi

      - name: Validate reviewed store update notes
        run: |
          python3 scripts/release_notes.py validate
          python3 -m unittest discover -s scripts/tests -p "test_release_notes.py"

      - name: Verify signing and Google service-account secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GCP_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" | jq -e \
            '.type == "service_account" and (.private_key | type == "string")' >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Derive unique Play version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$(( GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT ))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Generated versionCode ${version_code} is outside Play's supported range."
            exit 1
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # These KSP variants export Room schemas to the same directory, so keep them in separate Gradle invocations.
      - name: Run unit tests
        env:
          PITTECH_LIVE_ADS: ${{ inputs.release_track == 'production' }}
        run: gradle --no-daemon testDebugUnitTest -PpittechLiveAds=${PITTECH_LIVE_ADS}

      - name: Build release bundle with the track's ad unit
        env:
          PITTECH_LIVE_ADS: ${{ inputs.release_track == 'production' }}
        run: >-
          gradle --no-daemon bundleRelease
          -PpittechLiveAds=${PITTECH_LIVE_ADS}
          -PpittechVersionCode=${{ steps.version.outputs.code }}
          -PpittechVersionName=${{ steps.version.outputs.name }}

      - name: Sign bundle with the existing Play upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_store_path="${RUNNER_TEMP}/pittech-upload-key.jks"
          unsigned_bundle="app/build/outputs/bundle/release/app-release.aab"
          signed_bundle="app/build/outputs/bundle/release/app-release-signed.aab"
          trap 'rm -f "$key_store_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          chmod 600 "$key_store_path"
          jarsigner \
            -keystore "$key_store_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$signed_bundle" \
            "$unsigned_bundle" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$signed_bundle"

      - id: google-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ steps.google-auth.outputs.project_id }}

      - name: Enable Google Play Android Developer API
        run: gcloud services enable androidpublisher.googleapis.com --project="$GCP_PROJECT_ID"
        env:
          GCP_PROJECT_ID: ${{ steps.google-auth.outputs.project_id }}

      - name: Publish to Play Alpha closed testing
        if: inputs.release_track == 'alpha'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: com.pittech
          releaseFiles: app/build/outputs/bundle/release/app-release-signed.aab
          whatsNewDirectory: distribution/play/whatsnew
          releaseName: alpha-${{ github.run_number }}
          tracks: alpha
          # Alpha already has an active release; make this update available to enrolled testers.
          status: completed

      - name: Publish staged production rollout
        if: inputs.release_track == 'production'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: com.pittech
          releaseFiles: app/build/outputs/bundle/release/app-release-signed.aab
          whatsNewDirectory: distribution/play/whatsnew
          releaseName: production-${{ github.run_number }}
          tracks: production
          status: inProgress
          userFraction: ${{ inputs.rollout_fraction }}

      - name: Keep a copy of the uploaded bundle
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-play-${{ inputs.release_track }}-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release-signed.aab
          if-no-files-found: error
          retention-days: 14
