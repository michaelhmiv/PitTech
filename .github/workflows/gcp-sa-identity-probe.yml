name: GCP service account identity probe

on:
  push:
    branches: [codex/gcp-sa-identity-probe]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate credential and report non-secret identity fields
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GCP_SERVICE_ACCOUNT_JSON" ]]
          jq -e '.type == "service_account" and (.client_email | type == "string")' <<< "$GCP_SERVICE_ACCOUNT_JSON" >/dev/null
          jq -r '"service_account_email=" + .client_email + "\nproject_id=" + .project_id' <<< "$GCP_SERVICE_ACCOUNT_JSON"
