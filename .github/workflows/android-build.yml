name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, test/telemetry-provider-integration]

concurrency:
  group: pittech-android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android-checks:
    name: Build and emulator UI tests (API ${{ matrix.api }}, font ${{ matrix.font_scale }})
    runs-on: ubuntu-24.04
    # Anti-hang protection lives in the per-phase emulator step budgets
    # below (each smaller than the old single 45-minute cliff, so a hang
    # fails in its own phase with attribution). This job value is only a
    # backstop covering the Gradle builds plus the sum of the phase budgets
    # (25 + 30 + 35 + 30 + 15 + 15 = 150, plus build/install time).
    timeout-minutes: 170
    # Keep Android 17 emulator results advisory while its system graphics stack is unstable.
    continue-on-error: ${{ matrix.api == 37 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            device: pixel_2
            font_scale: '1.15'
          - api: 36
            device: pixel_2
            font_scale: '1.5'
          - api: 37
            device: pixel_2
            font_scale: '1.15'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK and clean emulator image
        env:
          PITTECH_MATRIX_API: ${{ matrix.api }}
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must point to the Android SDK." >&2
            exit 1
          fi
          if [[ "$PITTECH_MATRIX_API" == "37" ]]; then
            image="system-images;android-37.0;google_apis_ps16k;x86_64"
            image_dir="$sdk_root/system-images/android-37.0/google_apis_ps16k/x86_64"
          else
            image="system-images;android-36;google_apis;x86_64"
            image_dir="$sdk_root/system-images/android-36/google_apis/x86_64"
          fi
          verify_image() {
            [[ -f "$image_dir/system.img" ]] || return 1
            if [[ -f "$image_dir/devices.xml" ]]; then
              python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' "$image_dir/devices.xml" || return 1
            fi
            return 0
          }
          for attempt in 1 2 3; do
            # Never trust the runner image's preinstalled system image: the
            # 20261101.360.1 ubuntu-24.04 image shipped a corrupt devices.xml
            # in both the android-36 and android-37.0 images, and sdkmanager
            # skips packages it considers already installed, so a corrupt
            # preinstalled copy would survive a plain --install. Delete any
            # preinstalled copy first so every lane boots a freshly
            # downloaded image, and verify the result before it is used.
            rm -rf "$image_dir"
            if sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platforms;android-36" "$image" "emulator" && verify_image; then
              echo "Installed and verified a clean emulator image on attempt $attempt:"
              cat "$image_dir/source.properties" || true
              exit 0
            fi
            echo "SDK install or image verification failed on attempt $attempt; retrying with a fresh image."
          done
          exit 1

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Verify public release-note tooling and safety policy
        run: |
          python3 scripts/release_notes.py validate
          python3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Run JVM tests and build debug and instrumented apps
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest

      # Room KSP variants share app/schemas. Keep every non-debug variant in its
      # own Gradle invocation so parallel KSP tasks cannot read a half-written schema.
      - name: Build unsigned regular app
        run: gradle assembleRelease

      - name: Build Firebase Dev variant
        run: gradle assembleDev

      - name: Build previous release for a data-preserving upgrade test
        if: matrix.api == 36 && matrix.font_scale == '1.15' && github.event_name == 'pull_request'
        env:
          PITTECH_PREVIOUS_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/pittech-before" "$PITTECH_PREVIOUS_SHA"
          python3 scripts/prepare-upgrade-fixture.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pittech-before"
          gradle -p "$RUNNER_TEMP/pittech-before" assembleDebug assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      # The emulator phases run as separate steps of this job, sharing one
      # emulator started (detached) by the boot phase. Each phase has its own
      # budget below the old single 45-minute cliff; same script, same tests.
      # 25 minutes fits the boot script's own design: two attempts, each up
      # to a 240s device wait plus the 7-minute boot deadline (~11 minutes
      # with AVD creation). At 20 the second attempt could be cut mid-boot.
      - name: Boot emulator
        timeout-minutes: 25
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh boot

      # 30 minutes covers the telemetry restart's 600s staged deadline
      # (raised from 300s after the font-1.5 lane missed it at the
      # foreground-service stage) alongside the phase's 12m-wrapped runs.
      - name: Run upgrade and process-death phases
        timeout-minutes: 30
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh upgrade

      # 35 minutes: the green font-1.15 lane runs this phase's content in
      # ~17.5 minutes, and the slower font-1.5 draws inflate it ~1.35x
      # (chunk timings, PR #310), projecting a passing slow run at ~24
      # minutes before the finer companion chunking added three more
      # instrumentation launches. 25 left no headroom for a slow pass.
      - name: Run data and integration suites
        timeout-minutes: 35
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh suites

      - name: Run UI flow suites
        timeout-minutes: 30
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh flows

      - name: Run controller diagnostics suites
        if: matrix.api == 36
        timeout-minutes: 15
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh controller

      - name: Collect screenshots and verify crash recovery
        timeout-minutes: 15
        env:
          PITTECH_API_LEVEL: ${{ matrix.api }}
          PITTECH_EMULATOR_DEVICE: ${{ matrix.device }}
          PITTECH_FONT_SCALE: ${{ matrix.font_scale }}
        run: bash scripts/run-emulator-ui-tests.sh verify

      - name: Upload exported Room schemas
        if: matrix.api == 36 && matrix.font_scale == '1.15'
        uses: actions/upload-artifact@v6
        with:
          name: pittech-room-schemas
          path: app/schemas/
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-debug-apk-api-${{ matrix.api }}-font-${{ matrix.font_scale }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK signing tool for locally secured preview builds
        if: matrix.api == 36 && matrix.font_scale == '1.15'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-apksigner-tool
          path: ${{ env.ANDROID_SDK_ROOT }}/build-tools/37.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned regular app for private signing
        if: matrix.api == 36 && matrix.font_scale == '1.15'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload emulator screenshots, UI hierarchy, and test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-emulator-test-evidence-api-${{ matrix.api }}-font-${{ matrix.font_scale }}
          path: |
            app/build/ci-emulator/**
            app/schemas/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
