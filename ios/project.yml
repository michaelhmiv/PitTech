name: PitTech
options:
  bundleIdPrefix: com.pittech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: PitTech/Info.plist
packages:
  CombustionBLE:
    url: https://github.com/combustion-inc/combustion-ios-ble.git
    exactVersion: 1.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  PitTech:
    type: application
    platform: iOS
    sources:
      - path: PitTech
    resources:
      - path: PitTech/PrivacyInfo.xcprivacy
      - path: PitTech/TelemetryNotices.txt
    dependencies:
      - package: CombustionBLE
        product: CombustionBLE
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech
        PRODUCT_NAME: PitTech
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        PITTECH_ADMOB_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        PITTECH_NATIVE_AD_UNIT_ID: "ca-app-pub-3940256099942544/3986624511"
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # App Store builds sign manually with the CI-generated profile.
          # Scoped to this target only: Swift Package targets (GoogleMobileAds,
          # ZIPFoundation, ...) reject provisioning profiles, so these settings
          # must never be passed as global xcodebuild overrides.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "R42LWFBXBH"
          PROVISIONING_PROFILE_SPECIFIER: "PitTech App Store CI"
    scheme:
      testTargets: [PitTechTests, PitTechUITests]
      gatherCoverageData: false
  PitTechTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitTechTests
        excludes: ["Fixtures/**"]
      - path: PitTechTests/Fixtures/android-meal-v9.zip
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-cook-pack-recipe-v1.pittech
        buildPhase: resources
      - path: PitTechTests/Fixtures/android-cook-pack-collection-v1.pittech
        buildPhase: resources
    dependencies:
      - target: PitTech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech.tests

  PitTechUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PitTechUITests]
    dependencies:
      - target: PitTech
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.pittech.uitests
        TEST_TARGET_NAME: PitTech
