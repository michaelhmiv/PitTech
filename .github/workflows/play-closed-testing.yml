name: Play closed testing

on:
  # PR merges to main emit a push event. This also intentionally covers direct pushes to main.
  push:
    branches: [main]

concurrency:
  group: pittech-play-closed-testing
  queue: max

permissions:
  contents: read

jobs:
  publish-alpha:
    name: Build and publish Alpha closed-test bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Verify signing and Google service-account secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            GCP_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" | jq -e \
            '.type == "service_account" and (.private_key | type == "string")' >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Derive unique Play version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$(( GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT ))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Generated versionCode ${version_code} is outside Play's supported range."
            exit 1
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and build release bundle
        run: >-
          gradle --no-daemon testDebugUnitTest bundleRelease
          -PpittechLiveAds=false
          -PpittechVersionCode=${{ steps.version.outputs.code }}
          -PpittechVersionName=${{ steps.version.outputs.name }}

      - name: Sign bundle with the existing Play upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_store_path="${RUNNER_TEMP}/pittech-upload-key.jks"
          unsigned_bundle="app/build/outputs/bundle/release/app-release.aab"
          signed_bundle="app/build/outputs/bundle/release/app-release-signed.aab"
          trap 'rm -f "$key_store_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          chmod 600 "$key_store_path"
          jarsigner \
            -keystore "$key_store_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$signed_bundle" \
            "$unsigned_bundle" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$signed_bundle"

      - id: google-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ steps.google-auth.outputs.project_id }}

      - name: Enable Google Play Android Developer API
        run: gcloud services enable androidpublisher.googleapis.com --project="$GCP_PROJECT_ID"
        env:
          GCP_PROJECT_ID: ${{ steps.google-auth.outputs.project_id }}

      - name: Publish to Play Alpha closed testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.google-auth.outputs.credentials_file_path }}
          packageName: com.pittech
          releaseFiles: app/build/outputs/bundle/release/app-release-signed.aab
          releaseName: main-${{ github.run_number }}
          tracks: alpha
          # Bootstrap release for this Draft app; switch to completed after first rollout.
          status: draft

      - name: Keep a copy of the uploaded bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-play-alpha-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release-signed.aab
          if-no-files-found: error
          retention-days: 14
