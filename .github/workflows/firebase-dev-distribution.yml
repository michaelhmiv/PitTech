name: Firebase Dev distribution

on:
  workflow_dispatch:
    inputs:
      confirm_distribution:
        description: Explicitly authorize distributing the tested main build to Firebase testers.
        required: true
        type: boolean
        default: false

concurrency:
  group: pittech-firebase-dev
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    name: Build and distribute PitTech Dev
    # A merge authorizes code integration, not app distribution.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_distribution && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Require successful Android checks for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=30")
          tested_run=$(jq -er '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_sha == env.GITHUB_SHA)] | first' <<< "$runs")
          test_number=$(jq -er '.run_number' <<< "$tested_run")
          test_attempt=$(jq -er '.run_attempt' <<< "$tested_run")
          echo "PITTECH_TESTED_RUN_NUMBER=$test_number" >> "$GITHUB_ENV"
          echo "PITTECH_TESTED_RUN_ATTEMPT=$test_attempt" >> "$GITHUB_ENV"

      - name: Verify signing and Google service-account secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            FIREBASE_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Required GitHub Actions secret ${secret_name} is not configured."
              exit 1
            fi
          done
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -e \
            '.type == "service_account" and (.private_key | type == "string")' >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Derive unique Dev version
        id: version
        env:
          SOURCE_RUN_NUMBER: ${{ env.PITTECH_TESTED_RUN_NUMBER }}
          SOURCE_RUN_ATTEMPT: ${{ env.PITTECH_TESTED_RUN_ATTEMPT }}
        run: |
          set -euo pipefail
          version_code=$(( SOURCE_RUN_NUMBER * 1000 + SOURCE_RUN_ATTEMPT ))
          if (( version_code < 2 || version_code > 2100000000 )); then
            echo "::error::Generated versionCode ${version_code} is outside Android's supported range."
            exit 1
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=0.1.${SOURCE_RUN_NUMBER}-dev" >> "$GITHUB_OUTPUT"

      - name: Build the Dev APK with test ads
        run: >-
          gradle --no-daemon assembleDev
          -PpittechLiveAds=false
          -PpittechVersionCode=${{ steps.version.outputs.code }}
          -PpittechVersionName=${{ steps.version.outputs.name }}

      - name: Sign the Dev APK with the existing Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_store_path="${RUNNER_TEMP}/pittech-upload-key.jks"
          unsigned_apk="app/build/outputs/apk/dev/app-dev-unsigned.apk"
          signed_apk="${RUNNER_TEMP}/pittech-dev.apk"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner"
          trap 'rm -f "$key_store_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store_path"
          chmod 600 "$key_store_path"
          "$apksigner" sign \
            --ks "$key_store_path" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$apksigner" verify --verbose "$signed_apk"

      - id: google-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: |
          npm install --global firebase-tools
          firebase --version

      - name: Create change notes for Firebase testers
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          REPO_NAME: ${{ github.repository }}
        run: >-
          python3 scripts/release_notes.py dev
          --commit "$SOURCE_SHA"
          --version "$VERSION_NAME"
          --repo "$REPO_NAME"
          --output "$RUNNER_TEMP/pittech-dev-notes.txt"

      - name: Distribute to the internal Firebase group
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
          PITTECH_DEV_APK: ${{ runner.temp }}/pittech-dev.apk
          SOURCE_RUN_NUMBER: ${{ env.PITTECH_TESTED_RUN_NUMBER }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          firebase appdistribution:distribute "$PITTECH_DEV_APK" \
            --app "1:848714330882:android:328e155174c939db6b481b" \
            --groups "pittech-dev" \
            --release-notes-file "$RUNNER_TEMP/pittech-dev-notes.txt"
