name: Telemetry public release audit
on:
  pull_request:
    branches: [main, test/telemetry-provider-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager --install --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'
      - name: Check source isolation and audit regressions
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/telemetry_release_audit.py --strict
      - name: Build public artifacts and record resolved dependencies
        run: gradle assembleRelease bundleRelease recordPublicRuntimeDependencies
      - name: Inspect public APK and App Bundle DEX
        run: >-
          python3 scripts/telemetry_release_audit.py --strict
          --artifact app/build/outputs/apk/release/app-release-unsigned.apk
          --artifact app/build/outputs/bundle/release/app-release.aab
          --dependencies app/build/reports/telemetry/release-runtime-dependencies.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: telemetry-public-isolation-evidence
          path: |
            app/build/reports/telemetry/**
            app/build/intermediates/merged_manifests/**
            app/build/outputs/apk/release/**
            app/build/outputs/bundle/release/**
          retention-days: 14
