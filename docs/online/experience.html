<div class="review"><div class="reviewhead"><div><h1>PitTech, thoughtfully connected.</h1><p>Experience review · issue #89 · synthetic cook examples. Native hierarchy, warm surfaces, optional accounts and flexible recipes.</p></div><div class="tools"><button id="theme" aria-pressed="false">Dark mode</button><button id="large" aria-pressed="false">Large text</button><select id="width" aria-label="Device size"><option value="phone">Phone · 390</option><option value="tablet">Tablet · 850</option></select></div></div>

<script>
const $=s=>document.querySelector(s),icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`;
const screens=[['meals','Meals','Cook locally'],['recipes','Recipes','Save & compose'],['discover','Discover','Explore freely'],['detail','Recipe detail','Pinned source'],['collection','Meal collection','Flexible selection'],['publish','Publish draft','Deliberate sharing'],['live','Live cook','Current & reference'],['timeline','Timeline','Paired milestones'],['charts','Charts','Distinct measurements'],['insights','Insights','Personal first'],['more','More','Optional account'],['signin','Sign in','Return to task']];let screen='meals',guide=false;
function header(title,sub,eyebrow='Your kitchen',action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p class="subtitle">${sub}</p></div>${action}</div>`}
function section(title,right=''){return `<div class="section"><h3>${title}</h3><small>${right}</small></div>`}
function primary(text,action,ic=''){return `<button class="primary full" data-action="${action}">${ic?icon(ic):''}${text}</button>`}
function guideBar(){return `<div class="guidebar"><div><strong>Show guide</strong><small>Oak-smoked pork · version 2</small></div><button class="switch" role="switch" aria-label="Show guide across this meal" aria-checked="${guide}" data-action="guide"><span></span></button></div>`}
function segments(active){return `<div class="segmented">${['live','timeline','charts'].map(s=>`<button class="${s===active?'selected':''}" data-screen="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>`}
function photo(kind='flame',label='Pork · low & slow',detail=false){return `<div class="hero ${detail?'detailhero':''}">${icon(kind)}<span class="photo">No photo selected</span><span class="corner">${label}</span></div>`}
function recipe(name,kind,food,facts,credit='Saved from your cook',collection=false){return `<article class="card recipe" data-screen="${collection?'collection':'detail'}" tabindex="0" role="button" aria-label="Open ${name}">${photo(kind,food)}<div class="recipebody"><h3>${name}</h3><div class="facts"><span>${icon('clock')}${facts}</span></div><div class="credit">${icon(collection?'book':'fork')}${credit}</div><div class="recipefooter"><span class="meta">${collection?'Meal collection · 2 dishes':'Recipe · version 2'}</span>${icon('arrow')}</div></div></article>`}
function search(placeholder){return `<div class="search"><label class="searchbox">${icon('search')}<input aria-label="${placeholder}" placeholder="${placeholder}"></label><button class="iconbtn" aria-label="Filter recipes" data-action="filters">${icon('filter')}</button></div>`}
function chart(){return `<svg class="chart" viewBox="0 0 310 180" role="img" aria-label="Synthetic current and author pork temperature curves. The source has a recording gap."><g class="grid"><path d="M32 20h266 M32 60h266 M32 100h266 M32 140h266"/></g><g><text x="2" y="24">200°</text><text x="2" y="64">150°</text><text x="2" y="104">100°</text><text x="9" y="144">50°</text><text x="32" y="166">Food on</text><text x="114" y="166">2h</text><text x="204" y="166">4h</text><text x="280" y="166">6h</text></g>${guide?'<path class="reference" d="M34 136C54 113 68 82 95 64S143 58 160 55 M183 53C209 52 221 26 295 20"/>':''}<path class="current" d="M34 136C54 127 71 96 95 81S130 64 160 61 188 60 195 56"/><circle cx="195" cy="56" r="4" fill="var(--ember)"/></svg><div class="legend"><span><i class="swatch"></i>Your pork</span>${guide?'<span><i class="swatch ref"></i>Author · pork</span>':''}</div>`}
function cookHead(){return `<div class="backrow"><button data-screen="meals">${icon('back')}Meals</button><button data-screen="more">${icon('temp')}Devices</button></div>${header('Sunday smoke','Pork shoulder & potatoes','Cooking · 4h 12m')}${guideBar()}`}
function render(){let content='',foot='',tab='meals';
if(screen==='meals'){content=header('Meals','A good cook starts here.')+`<div class="card active"><div class="badge"><span class="dot"></span>COOKING</div><h3 class="cardtitle">Sunday smoke</h3><div class="meta">Started 8:15 AM · 4h 12m elapsed</div><div class="foodrow"><div><strong>Pork shoulder</strong><div class="meta">Heating · wrapped 12 min ago</div></div><span class="reading">164°</span></div><div class="foodrow"><div><strong>Baby potatoes</strong><div class="meta">Preparing · not on yet</div></div><span class="meta">No reading</span></div><div class="spacer"></div>${primary('Resume cook','live','flame')}</div><div class="spacer"></div><button class="secondary full" data-action="start">${icon('plus')}Start meal</button>${section('Cooked & remembered','Your history')}<div class="card"><div class="meta">OCT 12</div><h3 class="cardtitle">Steak night</h3><div class="meta">Ribeye · 1h 18m</div><div class="spacer"></div><div class="badge">Would cook again</div></div><button class="quiet full" data-action="planning">Planning & playbooks ${icon('arrow')}</button>`}
if(screen==='recipes'){tab='recipes';content=header('Recipes','Your favorites, ready for another cook.','Your cookbook',`<button class="iconbtn" aria-label="Compose meal" data-screen="collection">${icon('plus')}</button>`)+search('Find a saved recipe')+`<div class="chips"><button class="chip selected">All recipes</button><button class="chip" data-action="favorite">Favorites</button><button class="chip" data-screen="collection">Collections</button></div>${section('Ready to repeat','2 recipes')}<div class="recipes">${recipe('Oak-smoked pork shoulder','flame','Pork · shoulder','8.5 lb · 7h 40m')}${recipe('Rosemary baby potatoes','book','Vegetables · potatoes','1.5 lb · 55m')}</div>`}
if(screen==='discover'){tab='discover';content=header('Find your next cook','Recipes worth making your own.','Discover')+search('Search recipes, cuts, cooks')+`<div class="chips"><button class="chip selected">All food</button><button class="chip">Pork</button><button class="chip">Beef</button><button class="chip">Vegetables</button></div>${section('Tried, liked & made again')}<div class="recipes">${recipe('Oak-smoked pork shoulder','flame','Pork · shoulder','8.5 lb · 7h 40m','By an example cook · 24 likes')}${recipe('A slow Sunday','book','Pork & potatoes','2 dishes · low & slow','A PitTech cook',true)}</div>`}
if(screen==='detail'){tab='recipes';content=`<div class="backrow"><button data-screen="recipes">${icon('back')}Recipes</button><button aria-label="Recipe actions" data-action="recipe-menu">${icon('more')}</button></div>`+photo('flame','Pork · shoulder',true)+header('Oak-smoked pork shoulder','A steady cook, a good bark, a long rest.','Recipe · version 2')+`<div class="credit">${icon('fork')}Saved from an example cook</div><div class="stats"><div class="stat"><strong>8.5 lb</strong><span>Recorded weight</span></div><div class="stat"><strong>7h 40m</strong><span>Food on → off</span></div><div class="stat"><strong>250°F</strong><span>Recorded pit</span></div></div><div class="actions"><button class="secondary" data-action="save">${icon('save')}Save recipe</button><button class="primary" data-action="cook">${icon('flame')}Cook this</button></div>${section('Ingredients')}<p class="textblock">Pork shoulder, salt, black pepper, paprika.<br>Season to taste; these notes are editable.</p>${section('Instructions')}<div class="instruction"><span class="step">1</span><div><h4>Season and settle the pit</h4><p>Let the rub sit while the smoker comes up to temperature.</p></div></div><div class="instruction"><span class="step">2</span><div><h4>Check the bark before wrapping</h4><p>Use the surface and feel, then wrap when you are happy with the bark.</p></div></div>${section('The recorded cook')}<div class="card"><div class="event source"><div class="overline">AUTHOR · +3h20m</div><strong>Wrapped in butcher paper</strong><p>Food 162°F · bark set.</p></div><div class="spacer"></div><span class="meta">These observations are guidance for a new cook.</span></div>`}
if(screen==='collection'){tab='recipes';content=`<div class="backrow"><button data-screen="recipes">${icon('back')}Recipes</button><span>Collection</span></div>`+header('A slow Sunday','Choose what you want to cook.','Meal collection')+`<div class="card"><div class="rowcheck"><input type="checkbox" id="pork" checked><label for="pork"><strong>Oak-smoked pork shoulder</strong><br><span class="meta">8.5 lb · version 2 · independent guide</span></label></div><div class="rowcheck"><input type="checkbox" id="potatoes" checked><label for="potatoes"><strong>Rosemary baby potatoes</strong><br><span class="meta">1.5 lb · version 1 · 55m</span></label></div><button class="quiet full" data-action="add-dish">${icon('plus')}Add another recipe</button></div><div class="spacer"></div><p class="textblock">Keep both dishes or take only the pork. Your saved recipes and the author's cook stay intact.</p><div class="field"><label for="meal-name">Your meal name</label><input id="meal-name" value="Sunday smoke"></div>${primary('Cook selected dishes','cook','flame')}<button class="quiet full" data-action="save">Save this combination</button>`}
if(screen==='publish'){tab='recipes';content=`<div class="backrow"><button data-screen="detail">${icon('back')}Save draft</button><span>Draft saved locally</span></div>`+header('Make it yours','Share the recipe you want others to cook.','Publish a variation')+`<div class="card"><div class="rowcheck"><input id="share-pork" type="checkbox" checked><label for="share-pork">Pork shoulder</label></div><div class="rowcheck"><input id="share-potatoes" type="checkbox"><label for="share-potatoes">Baby potatoes <span class="meta">· excluded</span></label></div><div class="meta">The original two-dish meal is unchanged.</div></div><div class="field"><label for="publication-title">Title</label><input id="publication-title" value="Pepper-forward oak-smoked pork"></div><div class="field"><label for="instructions">Instructions</label><textarea id="instructions">Use a generous layer of black pepper. Check the bark before wrapping in paper.</textarea></div><div class="rowcheck"><input id="story" type="checkbox" checked><label for="story">Include the selected pork cook story<br><span class="meta">Milestones, readings and chosen photos</span></label></div>${section('Publish as')}<div class="chips"><button class="chip selected" data-action="anonymous">A PitTech cook</button><button class="chip" data-action="named">My display name</button></div><p class="textblock">Anonymous items stay off your public profile. Source credit is retained without exposing your account.</p><button class="secondary full" data-screen="detail">Preview exactly what is public</button><div class="spacer"></div>${primary('Sign in to publish','signin')}<p class="meta">Sign-in is optional for saving and cooking.</p>`}
if(['live','timeline','charts'].includes(screen)){content=cookHead()+segments(screen);if(screen==='live'){content+=section('Heating','1 dish')+`<div class="card active"><div class="cardtitle">Pork shoulder</div><div class="foodrow"><div><div class="meta">Food temperature</div><span class="reading">164°F</span></div><div><div class="meta">Pit temperature</div><span class="reading">249°F</span></div></div><div class="meta">Wrapped at +4h · updated just now</div>${guide?'<div class="guidecontext"><strong>Author wrapped at +3h20m</strong><br>Food 162°F · your cook is 40m later.</div>':''}</div>${section('Preparing','1 dish')}<div class="card"><h3 class="cardtitle">Baby potatoes</h3><p class="meta">Not on yet. Log Food on when ready.</p><button class="secondary full" data-action="food-on">Log Food on</button></div>`;foot=`<div class="logbar">${[['note','Log'],['temp','Temp'],['camera','Photo'],['bell','Reminder']].map(([i,l])=>`<button data-action="${l.toLowerCase()}">${icon(i)}${l}</button>`).join('')}</div>`}
if(screen==='timeline'){content+=`<div class="chips"><button class="chip selected">Pork shoulder</button><button class="chip">All dishes</button></div>${section('The wrap','Aligned to Food on')}<div class="timelinepair">${guide?'<div class="event source"><div class="overline">AUTHOR · +3h20m</div><strong>Wrapped in paper</strong><p>162°F · bark set, no spritz.</p></div>':''}<div class="event"><div class="overline">YOUR COOK · +4h</div><strong>Wrapped in paper</strong><p>164°F · wanted a darker bark.</p></div></div>${section('Getting started')}<div class="timelinepair">${guide?'<div class="event source"><div class="overline">AUTHOR · FOOD ON</div><strong>Started the shoulder</strong><p>250°F pit · oak.</p></div>':''}<div class="event"><div class="overline">YOUR COOK · FOOD ON</div><strong>Started the shoulder</strong><p>8:15 AM · 248°F pit.</p></div></div><p class="meta">${guide?'Source observations are reference only. They do not mark your steps complete.':'Show guide to view the author’s recorded milestones alongside your activity.'}</p>`}
if(screen==='charts'){content+=`<div class="chips"><button class="chip selected">Pork · food</button><button class="chip">Pit</button></div>${section('Heating so far','°F')}<div class="card">${chart()}</div><div class="stats"><div class="stat"><strong>164°F</strong><span>Your latest reading</span></div><div class="stat"><strong>4h12m</strong><span>Since Food on</span></div></div><p class="meta">${guide?'Dashed source is aligned to this dish’s Food on. Its recording gap stays visible. No weight-based retiming.':'Your recorded measurements. Enable Show guide to compare the source curve.'}</p>`}}
if(screen==='insights'){tab='insights';content=header('Know your cook','A little perspective from your own history.','Insights')+`<div class="chips"><button class="chip selected">Pork shoulder</button><button class="chip">All food</button></div>${section('Your heating time','5 measured cooks')}<div class="card"><div class="meta">MEDIAN · FOOD ON TO OFF</div><div class="insight">7h 24m</div><p class="meta">Your latest cook was 16m longer.</p><div class="mini">${[67,86,62,74,82].map(h=>`<div style="--h:${h}%"></div>`).join('')}</div><div class="meta">Your last five pork shoulder cooks</div></div>${section('Worth repeating')}<div class="card"><h3 class="cardtitle">Oak-smoked pork shoulder</h3><div class="badge">5/5 · would cook again</div><p class="meta">Your verdict · Oct 12</p></div>${section('Go a little deeper','PitTech Pro')}<div class="card"><h3 class="cardtitle">Compare your temperature curves</h3><p class="meta">See what changed between your best cooks. Personal analysis works from your own library.</p><button class="quiet full" data-action="pro">Explore Pro · monthly only</button></div>`}
if(screen==='more'){tab='more';content=header('More','Everything around your cook.','PitTech')+`<div class="card"><h3 class="cardtitle">Your cookbook stays yours.</h3><p class="meta">Cook and save recipes without an account. Sign in when you want private sync or publishing.</p><button class="quiet full" data-screen="signin">Optional sign in ${icon('arrow')}</button></div>${section('Make yourself at home')}<div class="card">${[['temp','Devices & connections','Five read-only Beta connections'],['book','Import & export','Files, Cook Packs and backups'],['chart','Appearance & units','System theme · °F · lb'],['bell','Notifications','Your enabled reminders'],['user','Privacy & support','Help, feedback and data controls']].map(([i,t,s])=>`<button class="listrow" data-action="more-item">${icon(i)}<span class="text">${t}<span class="meta">${s}</span></span>${icon('arrow')}</button>`).join('')}</div>`}
if(screen==='signin'){tab='more';content=`<div class="backrow"><button data-screen="publish">${icon('back')}Back to your draft</button><button data-screen="more">Cancel</button></div><div class="signin"><div class="brand">${icon('flame')}</div><h2>A home for your<br>cookbook.</h2><p class="subtitle">Sign in to publish recipes and keep a private copy of your library across devices.</p><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div>${primary('Email me a sign-in link','auth')}<p class="meta">We’ll also send a six-digit code. No password, no newsletter.</p><hr class="divider"><p class="textblock">Your draft is saved. All local cooking, recipe saving and file sharing work without an account.</p></div>`}
const nav=screen==='signin'?'':`<nav class="nav" aria-label="App navigation">${[['meals','flame','Meals'],['recipes','book','Recipes'],['discover','compass','Discover'],['insights','chart','Insights'],['more','more','More']].map(([s,i,l])=>`<button data-screen="${s}" ${s===tab?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('')}</nav>`;
$('#app').innerHTML=`<div class="content">${content}</div>${foot}${nav}`;$('#index').innerHTML=screens.map(([s,l,d])=>`<button data-screen="${s}" ${s===screen?'aria-current="page"':''}>${l}<span class="sr-only"> · ${d}</span></button>`).join('');$('#caption').textContent=screens.find(x=>x[0]===screen)[2]+' · Review light/dark, large text and tablet. Example measurements are synthetic.';
}
document.addEventListener('click',e=>{const target=e.target.closest('[data-screen],[data-action]');if(!target)return;if(target.dataset.screen){screen=target.dataset.screen;render();return}const a=target.dataset.action;if(screens.some(x=>x[0]===a)){screen=a;render();return}if(a==='guide'){guide=!guide;render();return}const notices={save:'Saved copies are independently editable and pinned to their source.',cook:'A new attempt starts with new identities. Source measurements stay guidance.',auth:'Review state: email would contain a link plus a six-digit code. No email is sent.',pro:'Monthly Pro uses the store price. Free Insights stay available.',filters:'Native filter sheet: food, cut, weight, method and known duration.'};$('#toast').textContent=notices[a]||'Review interaction · native task details are defined in DESIGN.md.';$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.recipe')){e.preventDefault();screen=e.target.dataset.screen;render()}});
$('#theme').onclick=()=>{const d=document.body.classList.toggle('dark');$('#theme').textContent=d?'Light mode':'Dark mode';$('#theme').setAttribute('aria-pressed',d)};$('#large').onclick=()=>{const large=$('#large').getAttribute('aria-pressed')!=='true';document.documentElement.style.setProperty('--scale',large?'1.35':'1');$('#large').setAttribute('aria-pressed',large);$('#large').textContent=large?'Default text':'Large text'};$('#width').onchange=e=>$('#device').classList.toggle('tablet',e.target.value==='tablet');render();
</script></body></html>
