name: Online store paywall review capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paywall-capture:
    name: Capture the Pro paywall review screenshot
    if: github.repository == 'michaelhmiv/PitTech'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/PitTech.xcodeproj -scheme PitTech

      - name: Run the deterministic paywall review capture
        timeout-minutes: 30
        # This dispatch-only workflow's contract is the screenshot, not the
        # class result: ProPaywallUITests stays gated by ios-build's ui-3
        # shard. A sibling test's flake must not destroy an otherwise valid
        # capture (run 39733769205: 7/8 passed, the capture test green, the
        # artifact lost to an unrelated 5s alert-wait flake). The step may
        # therefore fail without failing the job; the verify step below is
        # the gate — it requires the result bundle and the capture test's
        # own "passed" line, and prints any sibling failures as warnings.
        continue-on-error: true
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = [device for group in json.load(sys.stdin)["devices"].values() for device in group if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not devices:
              raise SystemExit("No available iPhone Simulator was found.")
          def rank(device):
              name = device["name"]
              return ("Pro Max" in name, "Pro" in name, name)
          print(sorted(devices, key=rank, reverse=True)[0]["udid"])
          ')
          echo "Capturing on iPhone Simulator $device_id."
          xcrun simctl shutdown all || true
          # Class-level filter, deliberately: the method-level form
          # (-only-testing:.../testPaywallReviewScreenshotCapture) passes the
          # test and prints "** TEST SUCCEEDED **", then xcodebuild exits 1 on
          # the scheme's second (fully filtered-out) testable — reproduced in
          # runs 39717728789 and 39725475198. Class-level filters are the
          # shape every ios-build shard runs green. The export step below
          # selects the screenshot by its exact attachment name and refuses
          # ambiguity, so running the whole class cannot pick a wrong image.
          xcodebuild -project ios/PitTech.xcodeproj -scheme PitTech -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -derivedDataPath build/ios-simulator -resultBundlePath build/paywall-capture.xcresult -only-testing:PitTechUITests/ProPaywallUITests CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=R42LWFBXBH ENTITLEMENTS_REQUIRED=YES test 2>&1 | tee build/paywall-capture.log

      - name: Verify the capture test itself passed
        run: |
          set -euo pipefail
          if [ ! -d build/paywall-capture.xcresult ]; then
            echo "No result bundle: the capture run did not complete." >&2
            exit 1
          fi
          if ! grep -F "ProPaywallUITests testPaywallReviewScreenshotCapture]' passed" build/paywall-capture.log > /dev/null; then
            echo "The capture test did not pass; refusing to export a screenshot." >&2
            exit 1
          fi
          echo "Capture test passed."
          xcrun xcresulttool get test-results summary --path build/paywall-capture.xcresult > build/paywall-capture-summary.json 2>/dev/null || true
          python3 - <<'PY' || true
          import json, pathlib
          summary_path = pathlib.Path("build/paywall-capture-summary.json")
          if summary_path.exists():
              failures = json.loads(summary_path.read_text()).get("testFailures", [])
              for failure in failures:
                  print(f"::warning::Sibling test failed in the capture run (ios-build still gates it): {failure.get('testName', failure)}")
          PY

      - name: Export the named review screenshot
        run: |
          set -euo pipefail
          mkdir -p build/paywall-attachments build/paywall-review-screenshot
          xcrun xcresulttool export attachments --path build/paywall-capture.xcresult --output-path build/paywall-attachments
          python3 - <<'PY'
          import json, pathlib, shutil, struct
          export = pathlib.Path("build/paywall-attachments")
          manifest = export / "manifest.json"
          candidate = None
          if manifest.exists():
              for case in json.loads(manifest.read_text()):
                  for attachment in case.get("attachments", []):
                      if attachment.get("suggestedHumanReadableName", "").startswith("Native Pro paywall review screenshot"):
                          candidate = export / attachment["exportedFileName"]
          if candidate is None:
              pngs = sorted(export.rglob("*.png"))
              if len(pngs) == 1:
                  candidate = pngs[0]
          if candidate is None or not candidate.is_file():
              raise SystemExit("The paywall review attachment was not found; refusing to guess among exports.")
          data = candidate.read_bytes()
          if len(data) < 26 or not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("The paywall review attachment is not a PNG.")
          width, height = struct.unpack(">II", data[16:24])
          destination = pathlib.Path("build/paywall-review-screenshot/pittech-pro-paywall-review.png")
          shutil.copy2(candidate, destination)
          print(json.dumps({"reviewScreenshot": destination.name, "bytes": len(data), "width": width, "height": height}))
          PY

      - name: Expose the capture to visual review
        run: python3 scripts/emit-ui-review-images.py build/paywall-review-screenshot

      - name: Retain the paywall review screenshot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pittech-paywall-review-screenshot
          path: build/paywall-review-screenshot/pittech-pro-paywall-review.png
          if-no-files-found: error
          retention-days: 30
